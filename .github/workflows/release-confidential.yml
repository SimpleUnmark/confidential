name: Release confidential workload

# Main-only publication; approved digests are reviewed in a separate PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confidential-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-publish-attest:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/simpleunmark-confidential
      GCP_IMAGE: ${{ vars.GCP_IMAGE }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
      RELEASE_TAG: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release configuration
        run: |
          for variable in DOCKERHUB_USERNAME GCP_IMAGE GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_PUBLISHER_SERVICE_ACCOUNT; do
            if [[ -z "${!variable}" ]]; then
              echo "Required production variable is empty: ${variable}" >&2
              exit 2
            fi
          done
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = SimpleUnmark/confidential
          test "$DOCKERHUB_IMAGE" = docker.io/simpleunmark/simpleunmark-confidential
          test "$GCP_IMAGE" = europe-west1-docker.pkg.dev/simple-unmark-prod/workloads/simpleunmark-confidential
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Record build metadata
        id: build-values
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build once before acquiring registry credentials
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/confidential-server
          file: apps/confidential-server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.GCP_IMAGE }}:${{ env.RELEASE_TAG }}
          # Single platform manifest. Attach signed provenance separately below.
          provenance: false
          sbom: false
          build-args: |
            BUILD_DATE=${{ steps.build-values.outputs.created }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Package reviewed browser client
        run: |
          pnpm install --frozen-lockfile
          pnpm client:pack
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Exchange GitHub OIDC for a short-lived publisher token
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}
      - name: Push identical image and compare registry digests
        id: published
        run: |
          test "$(docker image inspect "$GCP_IMAGE:$RELEASE_TAG" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker push "$GCP_IMAGE:$RELEASE_TAG"
          docker push "$DOCKERHUB_IMAGE:$RELEASE_TAG"
          gcp_digest=$(docker buildx imagetools inspect "$GCP_IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          hub_digest=$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$gcp_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$gcp_digest" = "$hub_digest"
          for repository in "$GCP_IMAGE" "$DOCKERHUB_IMAGE"; do
            docker buildx imagetools inspect "$repository@$gcp_digest" --raw | jq -e '
              .schemaVersion == 2 and (has("manifests") | not) and
              (.mediaType == "application/vnd.oci.image.manifest.v1+json" or
               .mediaType == "application/vnd.docker.distribution.manifest.v2+json")' >/dev/null
          done
          echo "digest=$gcp_digest" >> "$GITHUB_OUTPUT"
      - name: Attest Docker Hub build provenance
        id: attest-hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
      - name: Attest Artifact Registry build provenance
        id: attest-gcp
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.GCP_IMAGE }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
      - name: Attest browser client provenance
        id: attest-client
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.tgz
      - name: Write unapproved release candidate
        env:
          RELEASE_DIGEST: ${{ steps.published.outputs.digest }}
        run: node scripts/release-policy.mjs candidate
      - name: Sign candidate metadata (not an approval)
        id: attest-candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/release-candidate.json
      - name: Preserve release evidence
        run: |
          mkdir -p artifacts/provenance
          cp '${{ steps.attest-hub.outputs.bundle-path }}' artifacts/provenance/dockerhub.sigstore.json
          cp '${{ steps.attest-gcp.outputs.bundle-path }}' artifacts/provenance/gcp.sigstore.json
          cp '${{ steps.attest-client.outputs.bundle-path }}' artifacts/provenance/client.sigstore.json
          cp '${{ steps.attest-candidate.outputs.bundle-path }}' artifacts/provenance/candidate.sigstore.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: confidential-release-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish review summary
        env:
          RELEASE_DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          echo "### Candidate published — not approved or deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "$GCP_IMAGE@$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "$DOCKERHUB_IMAGE@$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Review release-candidate.json and open a release-policy PR. See docs/release-security.md." >> "$GITHUB_STEP_SUMMARY"
