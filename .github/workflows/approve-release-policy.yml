name: Attest approved release policy

on:
  push:
    branches: [main]
    paths:
      - releases/approved-workloads.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest-policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # This is approval to trust the digests, separate from publication permission.
    environment: release-approval
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Reverify evidence before signing approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/*.test.mjs
          node scripts/release-policy.mjs verify
      - name: Attest the reviewed approval policy
        id: approval
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: releases/approved-workloads.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: approved-policy-${{ github.sha }}
          path: |
            releases/approved-workloads.json
            ${{ steps.approval.outputs.bundle-path }}
          retention-days: 90
