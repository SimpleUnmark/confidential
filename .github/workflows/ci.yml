name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
      - name: Validate approved releases and verification guardrails
        run: |
          node --test scripts/*.test.mjs
          node scripts/release-policy.mjs validate
      - name: Reject deleted history and reapproved revoked images
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:releases/approved-workloads.json"; then
            git show "$BASE_SHA:releases/approved-workloads.json" > "$RUNNER_TEMP/previous-policy.json"
            node scripts/release-policy.mjs transition "$RUNNER_TEMP/previous-policy.json"
          fi
      - name: Verify approved image provenance and public transparency evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-policy.mjs verify

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/confidential-server/requirements-dev.txt
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm server:setup
      - name: Verify Python and browser client
        run: pnpm lint && pnpm typecheck && pnpm test
      - name: Check client package
        run: pnpm client:pack
      - name: Build confidential workload image
        run: >-
          docker build --platform linux/amd64
          --file apps/confidential-server/Dockerfile
          --tag simpleunmark-confidential:ci
          apps/confidential-server

      - name: Smoke test production bootstrap dependencies offline
        run: >-
          docker run --rm --network=none --platform linux/amd64
          --entrypoint /usr/bin/python3 simpleunmark-confidential:ci
          -c 'import google_crc32c; from simpleunmark_confidential.bootstrap import bootstrap_credentials;
          assert google_crc32c.value(b"123456789") == 0xe3069283;
          print("Secret Manager bootstrap imports OK")'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - name: Verify version pins agree
        run: |
          test "$(cat infra/gcp/foundation/.terraform-version)" = '1.15.8'
          test "$(cat infra/gcp/terraform/.terraform-version)" = '1.15.8'
          test "$(cat infra/github/.terraform-version)" = '1.15.8'
      - name: Offline configuration checks (no backend or cloud credentials)
        run: |
          terraform fmt -check -recursive infra
          for stack in infra/gcp/foundation infra/gcp/terraform infra/github; do
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$stack" validate
          done
          terraform -chdir=infra/gcp/foundation test
          terraform -chdir=infra/gcp/terraform test
