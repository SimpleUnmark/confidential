name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/confidential-server/requirements-dev.txt
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm server:setup
      - name: Verify Python and browser client
        run: pnpm lint && pnpm typecheck && pnpm test
      - name: Check client package
        run: pnpm client:pack
      - name: Build confidential workload image
        run: >-
          docker build --platform linux/amd64
          --file apps/confidential-server/Dockerfile
          --tag simpleunmark-confidential:ci
          apps/confidential-server

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Verify version pins agree
        run: |
          test "$(cat infra/gcp/foundation/.terraform-version)" = '1.15.8'
          test "$(cat infra/gcp/terraform/.terraform-version)" = '1.15.8'
      - name: Offline configuration checks (no backend or cloud credentials)
        run: |
          terraform fmt -check -recursive infra/gcp
          for stack in foundation terraform; do
            terraform -chdir="infra/gcp/$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/gcp/$stack" validate
          done
